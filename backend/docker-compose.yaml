services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arirent-backend-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    networks:
      - arirent-network

  web:
    image: nginx:alpine
    container_name: arirent-backend-web
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - arirent-network

  db:
    image: mysql:8.0
    container_name: arirent-backend-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-arirent}
      MYSQL_USER: ${DB_USERNAME:-arirent}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - arirent-db-data:/var/lib/mysql
    networks:
      - arirent-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: arirent-backend-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootsecret
    depends_on:
      - db
    networks:
      - arirent-network

networks:
  arirent-network:
    driver: bridge

volumes:
  arirent-db-data:
    driver: local
